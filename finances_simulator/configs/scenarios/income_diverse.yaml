schema_version: "1.3"

scenario:
  name: income_diverse
  start_date: 2024-01-01
  default_months: 24

customer:
  currency: BRL
  primary_account_ref: primary_checking

customer_factory:
  income_profiles:
    - income_profile: SALARIED
      weight_basis_points: 3000
      source_bundles:
        - source_bundle_ref: salary_only
          weight_basis_points: 7500
          sources:
            - source_ref: primary_salary
              income_kind: SALARY
              payer: Example Employer Ltd.
              description: MONTHLY PAYROLL CREDIT
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 450000
                maximum_minor: 850000
                step_minor: 10000
              day_of_month: 5
              frequency: MONTHLY
              start_month_index: 0
              occurrences: 24
              payment_probability_basis_points: 10000
              volatility_basis_points: 250
              seasonality_basis_points: [10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 12000]
        - source_bundle_ref: salary_with_side_work
          weight_basis_points: 2500
          sources:
            - source_ref: primary_salary
              income_kind: SALARY
              payer: Example Employer Ltd.
              description: MONTHLY PAYROLL CREDIT
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 450000
                maximum_minor: 850000
                step_minor: 10000
              day_of_month: 5
              frequency: MONTHLY
              start_month_index: 0
              occurrences: 24
              payment_probability_basis_points: 10000
              volatility_basis_points: 250
              seasonality_basis_points: [10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 12000]
            - source_ref: occasional_side_work
              income_kind: OTHER
              payer: Example Project Client
              description: PROJECT SERVICE PAYMENT
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 40000
                maximum_minor: 120000
                step_minor: 10000
              day_of_month: 22
              frequency: EVERY_TWO_MONTHS
              start_month_index: 0
              occurrences: 12
              payment_probability_basis_points: 8000
              volatility_basis_points: 4000
              seasonality_basis_points: [8000, 8000, 9000, 9000, 10000, 11000, 11000, 10000, 10000, 11000, 13000, 15000]
    - income_profile: SELF_EMPLOYED
      weight_basis_points: 1700
      source_bundles:
        - source_bundle_ref: independent_services
          weight_basis_points: 10000
          sources:
            - source_ref: client_receipts
              income_kind: SELF_EMPLOYMENT
              payer: Example Client Network
              description: CLIENT SERVICE RECEIPT
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 220000
                maximum_minor: 620000
                step_minor: 10000
              day_of_month: 14
              frequency: MONTHLY
              start_month_index: 0
              occurrences: 24
              payment_probability_basis_points: 8500
              volatility_basis_points: 6000
              seasonality_basis_points: [7000, 8000, 9000, 10000, 11000, 11000, 9000, 8000, 10000, 12000, 14000, 15000]
    - income_profile: BUSINESS_OWNER
      weight_basis_points: 1200
      source_bundles:
        - source_bundle_ref: business_profit_draws
          weight_basis_points: 10000
          sources:
            - source_ref: quarterly_profit
              income_kind: BUSINESS_PROFIT
              payer: Example Trading Company
              description: BUSINESS PROFIT DISTRIBUTION
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 600000
                maximum_minor: 1800000
                step_minor: 50000
              day_of_month: 20
              frequency: QUARTERLY
              start_month_index: 0
              occurrences: 8
              payment_probability_basis_points: 9000
              volatility_basis_points: 8000
              seasonality_basis_points: [7000, 7000, 9000, 9000, 10000, 10000, 8000, 8000, 11000, 12000, 14000, 18000]
    - income_profile: RETIRED
      weight_basis_points: 1200
      source_bundles:
        - source_bundle_ref: pension_income
          weight_basis_points: 10000
          sources:
            - source_ref: monthly_pension
              income_kind: PENSION
              payer: Example Pension Administrator
              description: MONTHLY PENSION BENEFIT
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 250000
                maximum_minor: 550000
                step_minor: 10000
              day_of_month: 3
              frequency: MONTHLY
              start_month_index: 0
              occurrences: 24
              payment_probability_basis_points: 10000
              volatility_basis_points: 100
              seasonality_basis_points: [10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 20000]
    - income_profile: INVESTOR
      weight_basis_points: 900
      source_bundles:
        - source_bundle_ref: portfolio_distributions
          weight_basis_points: 10000
          sources:
            - source_ref: portfolio_cash_distribution
              income_kind: INVESTMENT_DISTRIBUTION
              payer: Example Asset Administrator
              description: PORTFOLIO CASH DISTRIBUTION
              destination_account_ref: reserve_savings
              amount_distribution:
                minimum_minor: 150000
                maximum_minor: 650000
                step_minor: 25000
              day_of_month: 18
              frequency: QUARTERLY
              start_month_index: 0
              occurrences: 8
              payment_probability_basis_points: 10000
              volatility_basis_points: 5000
              seasonality_basis_points: [10000, 10000, 11000, 11000, 9000, 9000, 10000, 10000, 12000, 12000, 14000, 16000]
    - income_profile: MIXED
      weight_basis_points: 1500
      source_bundles:
        - source_bundle_ref: consulting_and_distributions
          weight_basis_points: 10000
          sources:
            - source_ref: consulting_receipts
              income_kind: SELF_EMPLOYMENT
              payer: Example Consulting Clients
              description: CONSULTING SERVICE RECEIPT
              destination_account_ref: primary_checking
              amount_distribution:
                minimum_minor: 180000
                maximum_minor: 420000
                step_minor: 10000
              day_of_month: 12
              frequency: MONTHLY
              start_month_index: 0
              occurrences: 24
              payment_probability_basis_points: 9000
              volatility_basis_points: 5000
              seasonality_basis_points: [8000, 8500, 9000, 10000, 11000, 11000, 9000, 8500, 10000, 11500, 13000, 15000]
            - source_ref: fund_distributions
              income_kind: INVESTMENT_DISTRIBUTION
              payer: Example Fund Administrator
              description: FUND CASH DISTRIBUTION
              destination_account_ref: reserve_savings
              amount_distribution:
                minimum_minor: 120000
                maximum_minor: 240000
                step_minor: 10000
              day_of_month: 24
              frequency: QUARTERLY
              start_month_index: 0
              occurrences: 8
              payment_probability_basis_points: 10000
              volatility_basis_points: 3000
              seasonality_basis_points: [10000, 10000, 10000, 11000, 11000, 10000, 9000, 9000, 10000, 11000, 12000, 14000]
    - income_profile: UNEMPLOYED
      weight_basis_points: 500
      source_bundles:
        - source_bundle_ref: no_income
          weight_basis_points: 10000
          sources: []
  behavior_profiles:
    - behavior_profile: LOW_SPENDING
      weight_basis_points: 2500
      spending_multiplier_basis_points: 7000
      saving_multiplier_basis_points: 13000
    - behavior_profile: BALANCED
      weight_basis_points: 5000
      spending_multiplier_basis_points: 10000
      saving_multiplier_basis_points: 10000
    - behavior_profile: HIGH_SPENDING
      weight_basis_points: 2500
      spending_multiplier_basis_points: 14000
      saving_multiplier_basis_points: 6000
  wealth_profiles:
    - wealth_band: LOW
      weight_basis_points: 3500
      deposit_balance_multiplier_basis_points: 3000
      investment_balance_multiplier_basis_points: 2000
    - wealth_band: MIDDLE
      weight_basis_points: 4500
      deposit_balance_multiplier_basis_points: 10000
      investment_balance_multiplier_basis_points: 10000
    - wealth_band: HIGH
      weight_basis_points: 2000
      deposit_balance_multiplier_basis_points: 25000
      investment_balance_multiplier_basis_points: 40000

institutions:
  - institution_ref: bank_primary
    institution_id: fictional-bank-001
    institution_name: Fictional Bank
  - institution_ref: bank_reserve
    institution_id: fictional-bank-002
    institution_name: Example Digital Bank

accounts:
  - account_ref: primary_checking
    institution_ref: bank_primary
    account_label: Primary checking account
    account_type: CHECKING
    opening_balance_minor: 250000
  - account_ref: reserve_savings
    institution_ref: bank_reserve
    account_label: Reserve savings account
    account_type: SAVINGS
    opening_balance_minor: 100000

fixed_expenses:
  - rule_id: housing
    category: housing
    amount_minor: 180000
    day_of_month: 10
    payee: Example Property Management
    description: MONTHLY RENT
    source_account_ref: primary_checking
  - rule_id: electricity
    category: utilities
    amount_minor: 18000
    day_of_month: 12
    payee: Example Energy Utility
    description: ELECTRICITY BILL
    source_account_ref: primary_checking
  - rule_id: internet
    category: utilities
    amount_minor: 12000
    day_of_month: 15
    payee: Example Internet Provider
    description: HOME INTERNET
    source_account_ref: primary_checking
  - rule_id: mobile_phone
    category: communications
    amount_minor: 7000
    day_of_month: 18
    payee: Example Mobile Operator
    description: MOBILE PHONE PLAN
    source_account_ref: primary_checking
  - rule_id: health_insurance
    category: health
    amount_minor: 45000
    day_of_month: 20
    payee: Example Health Insurance
    description: HEALTH INSURANCE
    source_account_ref: primary_checking

variable_expenses:
  count_min: 12
  count_max: 24
  amount_min_minor: 1500
  amount_max_minor: 25000
  day_min: 1
  day_max: 28
  source_account_ref: primary_checking
  merchants:
    - entity: Example Supermarket
      description: PIX PAYMENT SUPERMARKET
    - entity: Example Pharmacy
      description: PIX PAYMENT PHARMACY
    - entity: Example Restaurant
      description: DEBIT PURCHASE RESTAURANT
    - entity: Example Transit Service
      description: TRANSIT PAYMENT

own_transfers:
  - rule_id: monthly_reserve
    source_account_ref: primary_checking
    destination_account_ref: reserve_savings
    amount_minor: 50000
    day_of_month: 6
    outgoing_description: TRANSFER TO OWN RESERVE
    incoming_description: TRANSFER FROM OWN PRIMARY

credit_cards:
  - card_ref: main_card
    institution_ref: bank_primary
    card_label: Main credit card
    credit_limit_minor: 500000
    statement_close_day: 20
    payment_due_day: 5
    payment_account_ref: primary_checking
    payment_description: CREDIT CARD INVOICE PAYMENT
    payment_policy: FULL_AUTOPAY
    utilization_policy:
      maximum_basis_points: 8000
      on_exceed: DECLINE

card_purchase_rules:
  - rule_id: recurring_household_purchase
    card_ref: main_card
    merchant: Example Household Store
    description: MONTHLY CARD PURCHASE HOUSEHOLD
    amount_minor: 50000
    day_of_month: 10
    start_month_index: 0
    interval_months: 1
    occurrences: 24
    installment_count: 1
  - rule_id: installment_electronics_purchase
    card_ref: main_card
    merchant: Example Electronics
    description: INSTALLMENT CARD PURCHASE ELECTRONICS
    amount_minor: 180000
    day_of_month: 21
    start_month_index: 0
    interval_months: 1
    occurrences: 1
    installment_count: 6
  - rule_id: close_day_remainder_purchase
    card_ref: main_card
    merchant: Example Furniture
    description: INSTALLMENT CARD PURCHASE ON STATEMENT CLOSE
    amount_minor: 10001
    day_of_month: 20
    start_month_index: 2
    interval_months: 1
    occurrences: 1
    installment_count: 3

loans:
  - loan_ref: personal_loan
    institution_ref: bank_primary
    loan_label: Personal loan
    loan_type: PERSONAL
    principal_minor: 360001
    annual_interest_basis_points: 1200
    term_months: 36
    amortization_system: CONSTANT_PRINCIPAL
    disbursement_account_ref: primary_checking
    disbursement_month_index: 1
    disbursement_day_of_month: 8
    payment_account_ref: primary_checking
    payment_day_of_month: 12
    disbursement_description: CONSULTING SERVICE RECEIPT
    payment_description: PERSONAL LOAN INSTALLMENT
    payment_policy: FULL_AUTOPAY

investments:
  - investment_ref: fixed_income_reserve
    institution_ref: bank_reserve
    investment_label: Fixed-income reserve
    investment_type: FIXED_INCOME
    opening_balance_minor: 50000
    monthly_return_basis_points: 75
    return_description: MONTHLY FIXED-INCOME RETURN

investment_contribution_rules:
  - rule_id: monthly_investment_contribution
    investment_ref: fixed_income_reserve
    account_ref: reserve_savings
    amount_minor: 30000
    day_of_month: 7
    start_month_index: 0
    interval_months: 1
    occurrences: 24
    description: MONTHLY INVESTMENT CONTRIBUTION

investment_redemption_rules:
  - rule_id: planned_investment_redemption
    investment_ref: fixed_income_reserve
    account_ref: primary_checking
    amount_minor: 120000
    day_of_month: 18
    start_month_index: 12
    interval_months: 1
    occurrences: 1
    description: FUND CASH DISTRIBUTION
