[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "income-estimator-demo"
version = "0.1.0"
description = "Single-process Streamlit demo of the simulator and the promoted income estimator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2",
    "altair>=5,<7",
    "pandas>=2.2",
    "finances-simulator",
    "income-estimator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["..", "../estimator/src", "../finances_simulator/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
